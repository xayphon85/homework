version: '3.9'

services:
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: calculator-backend
    ports:
      - "5050:5050"
    depends_on:
      - database
    environment:
      - DATABASE_URL=mysql+mysqlconnector://root:password@database:3306/calculator_db

  database:
    image: mysql:8
    container_name: calculator_database
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: calculator_db
    ports:
      - "3307:3306"
